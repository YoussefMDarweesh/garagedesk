<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="light dark" />
  <title>Offline · GarageDesk</title>
  <style>
    :root { --bg: #f4f6fb; --card: #ffffff; --text: #0b1324; --muted: #55607a; --accent: #c2410c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #060b18; --card: #131d36; --text: #f1f5ff; --muted: #a6b0c8; --accent: #fb923c; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
      background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, "Segoe UI", "IBM Plex Sans Arabic", Tahoma, sans-serif;
    }
    main { width: 100%; max-width: 30rem; background: var(--card); border-radius: 24px; padding: 2rem 1.5rem; text-align: center; box-shadow: 0 20px 50px -25px rgba(0, 0, 0, 0.35); }
    .mark { width: 4rem; height: 4rem; margin: 0 auto 0.75rem; display: block; }
    .word { display: block; height: 1.1rem; width: auto; margin: 0 auto 1.25rem; color: var(--text); overflow: visible; }
    h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
    p { margin: 0 0 1rem; color: var(--muted); }
    .ar { margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid rgba(127, 127, 127, 0.25); }
    a.retry {
      display: inline-block; margin-top: 0.5rem; padding: 0.65rem 1.4rem; border-radius: 999px;
      background: var(--accent); color: #fff; font-weight: 700; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="GarageDesk" focusable="false">
      <rect width="64" height="64" rx="17" fill="#101b36"/>
      <rect x=".5" y=".5" width="63" height="63" rx="16.5" fill="none" stroke="#fff" stroke-opacity=".2"/>
      <g transform="translate(32 32) scale(.9) translate(-32 -32)">
        <path d="M44 16A20 20 0 1 0 51.9 32H33" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M35.1 29.5L48 19" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
        <circle cx="32" cy="32" r="3.6" fill="none" stroke="#f97316" stroke-width="3.2"/>
      </g>
    </svg>
    <svg class="word" viewBox="-6 -6 622 84" aria-hidden="true" focusable="false">
      <g fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
        <path d="M60 17.2A30.5 30.5 0 1 0 66.5 36H38"/>
    <g transform="translate(81 0)"><circle cx="26" cy="46" r="20.5"/><path d="M46.5 25.5V66.5"/></g>
    <path transform="translate(142 0)" d="M5.5 25.5V66.5M5.5 48A22.5 22.5 0 0 1 28 25.5"/>
    <g transform="translate(184.5 0)"><circle cx="26" cy="46" r="20.5"/><path d="M46.5 25.5V66.5"/></g>
    <g transform="translate(245.5 0)"><circle cx="26" cy="46" r="20.5"/><path d="M46.5 25.5V80C46.5 91 38 96.5 26 96.5C19 96.5 13 94.5 9 90"/></g>
    <path transform="translate(306.5 0)" d="M5.5 46H46.5A20.5 20.5 0 1 0 41.7 59.2"/>
    <path transform="translate(367.5 0)" d="M5.5 5.5V66.5H34A30.5 30.5 0 0 0 34 5.5Z"/>
    <path transform="translate(446.5 0)" d="M5.5 46H46.5A20.5 20.5 0 1 0 41.7 59.2"/>
    <path transform="translate(507.5 0)" d="M40 31C37 27 31 25.5 24 25.5C14 25.5 9.5 30 9.5 35.5C9.5 41.5 15 43.5 24 46.5C33 49.5 40 51.5 40 58C40 63 35 66.5 24 66.5C16 66.5 9.5 64 6 59"/>
    <path transform="translate(562 0)" d="M5.5 5.5V66.5M41.5 25.5L5.5 50M21 40L43 66.5"/>
      </g>
    </svg>
    <section lang="en" dir="ltr">
      <h1>You are offline</h1>
      <p>GarageDesk needs an internet connection to show your shop's data. Nothing is lost: check your connection and try again.</p>
    </section>
    <section class="ar" lang="ar" dir="rtl">
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>يحتاج GarageDesk إلى اتصال بالإنترنت لعرض بيانات ورشتك. لم يضِع شيء: تحقق من اتصالك وحاول مرة أخرى.</p>
    </section>
    <a class="retry" href="/">Try again · حاول مرة أخرى</a>
  </main>
</body>
</html>
