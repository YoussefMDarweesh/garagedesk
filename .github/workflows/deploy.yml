name: Deploy to Azure

# Runs when something lands on main (or when you press "Run workflow" on the Actions tab).
# It stays skipped until the repository variable AZURE_WEBAPP_NAME exists. Setup steps: docs/DEPLOY.md
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time. A newer push waits for the running one instead of cutting it off halfway.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GarageDesk.sln

      - name: Build
        run: dotnet build GarageDesk.sln --configuration Release --no-restore

      # Never ship a build that fails its tests.
      - name: Test
        run: dotnet test GarageDesk.sln --configuration Release --no-build

      - name: Publish
        run: dotnet publish src/GarageDesk.Web/GarageDesk.Web.csproj --configuration Release --no-build --output ./publish

      # The publish profile is a secret you download from the App Service (docs/DEPLOY.md, step 5).
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
